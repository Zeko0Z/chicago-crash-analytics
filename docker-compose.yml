# =============================================================================
# Chicago Traffic Crash Analytics - Phase 1 local environment
# Services : PostgreSQL 16 (database) + pgAdmin 4 (web admin UI)
# Usage    : cp .env.example .env   # then edit the values
#            docker compose up -d
# All credentials come from the .env file (never committed to Git).
# =============================================================================

name: chicago-crashes

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL - official image from Docker Hub (library/postgres)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: crashes_postgres
    restart: unless-stopped
    environment:
      # ":?" makes Compose stop with a clear error if a value is missing in .env
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      # Use strong password hashing for all connections
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      TZ: ${TZ:-UTC}
    ports:
      # Bound to 127.0.0.1 so the database is reachable only from this computer
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Named volume = data survives "docker compose down" and container rebuilds
      - postgres_data:/var/lib/postgresql/data
      # Run once, on the very first start (empty volume): create schemas, tables, views
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./sql/views.sql:/docker-entrypoint-initdb.d/02_views.sql:ro
    healthcheck:
      # "$$" passes a literal "$" so the variables are read inside the container
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - crashes_net

  # ---------------------------------------------------------------------------
  # pgAdmin 4 - official image published by the pgAdmin project (dpage/pgadmin4)
  # ---------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:9
    container_name: crashes_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?Set PGADMIN_DEFAULT_EMAIL in .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD in .env}
      # Re-read servers.json on every start, so .env changes are picked up
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
      # pgAdmin does not need to send e-mail locally
      PGADMIN_DISABLE_POSTFIX: "True"
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    configs:
      # Pre-registers the PostgreSQL server in pgAdmin (no password stored here)
      - source: pgadmin_servers
        target: /pgadmin4/servers.json
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - crashes_net

# -----------------------------------------------------------------------------
# pgAdmin server definition, generated from .env values at start-up.
# Host "postgres" is the service name on the Docker network (not localhost).
# -----------------------------------------------------------------------------
configs:
  pgadmin_servers:
    content: |
      {
        "Servers": {
          "1": {
            "Name": "Chicago Crashes (Docker)",
            "Group": "Servers",
            "Host": "postgres",
            "Port": 5432,
            "MaintenanceDB": "${POSTGRES_DB:?Set POSTGRES_DB in .env}",
            "Username": "${POSTGRES_USER:?Set POSTGRES_USER in .env}",
            "SSLMode": "prefer"
          }
        }
      }

volumes:
  postgres_data:
    name: crashes_postgres_data
  pgadmin_data:
    name: crashes_pgadmin_data

networks:
  crashes_net:
    name: crashes_net
    driver: bridge
